[project]
name = "codex-podcast-studio"
version = "1.0.0"
description = "Generate researched German podcasts with Codex CLI and local TTS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Elandrya2711" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "click>=8.1,<9",
  "kokoro>=0.9.2",
  "misaki>=0.9.4",
  "numpy>=1.26,<2",
  "ormsgpack>=1.5,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.31,<3",
  "rich>=15,<16",
  "soundfile>=0.12",
  "trafilatura>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]
xtts = [
  "TTS>=0.22.0",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.33,<4.45",
]
# Sprechertrennung fuer `codcast voices extract`. Installiert wird das nicht hier,
# sondern per `codcast setup-diarize` in die separate .venv-diarize; diese Gruppe
# dokumentiert, welche Pakete der Worker braucht. Bewusst ohne pyannote: dessen
# Modelle sind auf HuggingFace gated, diese hier sind frei.
diarize = [
  "torch>=2.2",
  "torchaudio>=2.2",
  "speechbrain>=1.0",
  "silero-vad>=5.1",
  "scikit-learn>=1.4",
  "soundfile>=0.12",
  "numpy>=1.26,<2",
]

[project.scripts]
codcast = "codcast.cli:main"
podcast = "codcast.cli:podcast_main"

[project.urls]
Homepage = "https://github.com/Elandrya2711/codex-podcast-studio"
Repository = "https://github.com/Elandrya2711/codex-podcast-studio"
Issues = "https://github.com/Elandrya2711/codex-podcast-studio/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
